# Local development stack: docker compose -f compose.dev.yaml up
# See docker/dev/README.md for first-time setup (Neon branch + .env).
services:
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file: .env
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      REDIS_HOST: redis
    depends_on:
      - redis

  vite:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep Linux node_modules inside the container so they never clash with the host's.
      - node_modules:/app/node_modules

  redis:
    image: redis:7-alpine

volumes:
  node_modules:
